---
name: Java CI Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "ningxiang-**/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "ningxiang-**/**"
      - "src/**"
      - "pom.xml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Microservices Build & Verify (Java 21, ${{ matrix.distribution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        distribution: [temurin]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: ${{ matrix.distribution }}
          cache: maven

      - name: Compile Monorepo Microservices
        run: mvn clean compile -B -DskipTests

      - name: Run Unit Tests
        run: mvn test -B
...
